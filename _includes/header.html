<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-name">{{ site.title }}</span>
      <span class="brand-tag">{{ site.tagline }}</span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="{{ '/about/' | relative_url }}" {% if page.url == '/about/' %}aria-current="page"{% endif %}>About</a>
      <a href="{{ '/skills/' | relative_url }}" {% if page.url == '/skills/' %}aria-current="page"{% endif %}>Skills</a>
      <a href="{{ '/certifications/' | relative_url }}" {% if page.url == '/certifications/' %}aria-current="page"{% endif %}>Certifications</a>
      <button class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>
      </button>
    </nav>
  </div>
</header>
